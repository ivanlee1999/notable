name: Build and Release Version

on:
  workflow_dispatch:
  
permissions:
  contents: write

env:
  MAVEN_OPTS: >-
    -Dmaven.wagon.httpconnectionManager.ttlSeconds=120

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          # cache: gradle

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.1.0

      # Fail fast with an actionable message. Without a keystore Gradle silently skips signing
      # (the signingConfig is gated on STORE_FILE), emits app-release-unsigned.apk, and the run
      # only falls over later at "Rename APK" with a confusing missing-file error.
      - name: Check signing secrets
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "::error::KEYSTORE_FILE is not set. A fork cannot inherit the upstream signing key and must supply its own. Generate one with 'keytool -genkeypair -v -keystore notable-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias notable', then set KEYSTORE_FILE (base64 of the .jks), KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD as repository secrets."
            exit 1
          fi

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1.2.4
        with:
          fileDir: "./secrets"
          fileName: "my.keystore"
          encodedString: ${{ secrets.KEYSTORE_FILE }}

      # app/google-services.json is tracked in the repo, so this step is only an override for
      # builds that want their own Firebase project. Running it unconditionally on a fork with no
      # FIREBASE_CONFIG secret truncated the tracked file to empty and broke the Google Services
      # plugin, so decode only when the secret is actually present.
      - name: Decode and Replace `google-services.json`
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            echo "$FIREBASE_CONFIG" | base64 --decode > "${{ github.workspace }}/app/google-services.json"
          else
            echo "FIREBASE_CONFIG not set - keeping the google-services.json tracked in the repo."
          fi

      - name: Execute Gradle build
        env:
          STORE_FILE: ${{ github.workspace }}/secrets/my.keystore
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SHIPBOOK_APP_ID: ${{ secrets.SHIPBOOK_APP_ID }}
          SHIPBOOK_APP_KEY: ${{ secrets.SHIPBOOK_APP_KEY }}
        run: |
          ./gradlew assembleRelease \
            -PSTORE_FILE="$STORE_FILE" \
            -PSTORE_PASSWORD="$STORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD"

      #   - name: Cache Gradle packages
      #     uses: actions/cache@v1
      #     with:
      #         path: ~/.gradle/caches
      #         key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
      #         restore-keys: ${{ runner.os }}-gradle

      - name: Verify APK Files
        run: find ${{ github.workspace }}/app/build/outputs/apk/ -name "*.apk"

      - name: Retrieve Version
        env:
          STORE_FILE: ${{ github.workspace }}/secrets/my.keystore
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          SHIPBOOK_APP_ID: ${{ secrets.SHIPBOOK_APP_ID }}
          SHIPBOOK_APP_KEY: ${{ secrets.SHIPBOOK_APP_KEY }}
        run: |
          ./gradlew -q printVersionName
          VERSION_NAME=$(./gradlew -q printVersionName)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        id: android_version


      - name: Rename APK
        run: mv ${{ github.workspace }}/app/build/outputs/apk/release/app-release.apk ${{ github.workspace }}/app/build/outputs/apk/release/notable-${{ env.VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/app/build/outputs/apk/release/notable-${{ env.VERSION_NAME }}.apk
          tag_name: v${{ env.VERSION_NAME }}
          # Pin the new tag to the commit that was actually built. Without this the API defaults
          # target_commitish to the default branch, so a dispatch from a release/* branch tags
          # main's tip instead -- the APK is right, only the tag is wrong, and nothing fails.
          # v0.8.1 shipped that way and had to be retagged by hand.
          target_commitish: ${{ github.sha }}
          # Fall back to the automatic GITHUB_TOKEN, which `permissions: contents: write` above
          # already scopes for creating releases -- a fork has no inherited TOKEN secret.
          token: ${{ secrets.TOKEN || github.token }}
