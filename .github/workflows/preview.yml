name: Build and Release Preview
on:
  push:
    branches: ["dev", "main"]
    paths:
      - 'app/**'
  workflow_dispatch:
  
permissions:
  contents: write

env:
  MAVEN_OPTS: >-
    -Dmaven.wagon.httpconnectionManager.ttlSeconds=120

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          # cache: gradle

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.1.0

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1.2.4
        with:
          fileDir: "./secrets"
          fileName: "my.keystore"
          encodedString: ${{ secrets.KEYSTORE_FILE }}

      # app/google-services.json is tracked in the repo, so this step is only an override for
      # builds that want their own Firebase project. Running it unconditionally on a fork with no
      # FIREBASE_CONFIG secret overwrote the tracked file with an empty one and failed the build
      # at processDebugGoogleServices with "Malformed root json", so decode only when the secret
      # is actually present. release.yml already does this; preview.yml was missed.
      - name: Decode and Replace `google-services.json`
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            echo "$FIREBASE_CONFIG" | base64 --decode > "${{ github.workspace }}/app/google-services.json"
          else
            echo "FIREBASE_CONFIG not set - keeping the google-services.json tracked in the repo."
          fi

      - name: Execute Gradle build
        run: |
          export STORE_FILE="../${{ steps.decode_keystore.outputs.filePath }}"
          export STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
          # RELEASE_-prefixed, matching release.yml and the secrets that actually exist. Reading
          # the unprefixed names produced an empty alias and failed at packageDebug with
          # "No key with alias '' found in keystore" -- a signing error that reads like a broken
          # keystore rather than a typo in a secret name.
          export KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}"
          export KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"
          export SHIPBOOK_APP_ID="${{ secrets.SHIPBOOK_APP_ID }}"
          export SHIPBOOK_APP_KEY="${{ secrets.SHIPBOOK_APP_KEY }}"

          ./gradlew \
            -PIS_NEXT=true \
            assembleDebug

      #   - name: Cache Gradle packages
      #     uses: actions/cache@v1
      #     with:
      #         path: ~/.gradle/caches
      #         key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
      #         restore-keys: ${{ runner.os }}-gradle

      - run: mv ${{ github.workspace }}/app/build/outputs/apk/debug/app-debug.apk ${{ github.workspace }}/app/build/outputs/apk/debug/notable-next.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/app/build/outputs/apk/debug/notable-next.apk
          tag_name: next
          name: next
          prerelease: true
          make_latest: true 
          body: |
            ### Preview Build
            - **Branch:** `${{ github.ref_name }}`
            - **Commit:** `${{ github.sha }}`
            - **Build Date:** $(date +'%Y-%m-%d %H:%M')
          # Fall back to the automatic GITHUB_TOKEN, which `permissions: contents: write` above
          # already scopes for creating releases. There is no TOKEN secret on this repo, so the
          # action was handed an empty string and failed the whole job with
          # "Parameter token or opts.auth is required". release.yml already does this.
          token: ${{ secrets.TOKEN || github.token }}
