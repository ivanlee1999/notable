name: PR Android Tests
permissions:
  contents: read
on:
  pull_request:
    types: [labeled]
jobs:
  android-tests:
    if: github.event.label.name == 'run-android-tests'
    runs-on: ubuntu-latest
    # Keep a hard limit for a wedged emulator or instrumented test.
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
    services:
      couchdb:
        image: couchdb:3.5
        env:
          COUCHDB_USER: ci
          COUCHDB_PASSWORD: ci-test-only
        ports:
          - 5984:5984
        options: >-
          --health-cmd "curl -fsS http://localhost:5984/_up"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare isolated CouchDB sync account
        run: |
          status=$(curl --silent --show-error --user ci:ci-test-only \
            -o /tmp/couch-users-response.json -w '%{http_code}' \
            -X PUT http://127.0.0.1:5984/_users)
          case "$status" in 201|202|412) ;; *) cat /tmp/couch-users-response.json; exit 1 ;; esac
          curl --fail --silent --show-error --user ci:ci-test-only \
            -H 'Content-Type: application/json' -X PUT \
            http://127.0.0.1:5984/_users/org.couchdb.user:ci-sync \
            --data '{"name":"ci-sync","password":"ci-sync-test-only","roles":[],"type":"user"}'

      # Build before booting the emulator so Kotlin compilation and emulation do not
      # compete for the runner's CPU and memory.
      - name: Build instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # Recommended Linux setup from reactivecircus/android-emulator-runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check instrumentation report guard
        run: python3 -m unittest discover -s scripts -p 'test_check_android_test_results.py'

      - name: Run Android Instrumentation Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # FLAG_CANCELED palm-rejection events were introduced in Android 13.
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot-save
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            test_status=0; ./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true -PNOTABLE_COUCH_URL=http://10.0.2.2:5984 -PNOTABLE_COUCH_USER=ci-sync -PNOTABLE_COUCH_PASSWORD=ci-sync-test-only -PNOTABLE_COUCH_ADMIN_USER=ci -PNOTABLE_COUCH_ADMIN_PASSWORD=ci-test-only || test_status=$?; adb pull /sdcard/Android/data/com.ethran.notable/files/ui-review ui-review || true; adb logcat -d > android-instrumentation-logcat.txt || true; exit "$test_status"

      # AGP can exit zero even when the XML contains assumption failures. Independently
      # require clean reports and a CouchDB suite that actually executed.
      - name: Verify instrumentation results
        if: always()
        run: python3 scripts/check_android_test_results.py app/build/outputs/androidTest-results/connected

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
            android-instrumentation-logcat.txt
            ui-review
          if-no-files-found: warn

      - name: Remove Label
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'run-android-tests'
            })
