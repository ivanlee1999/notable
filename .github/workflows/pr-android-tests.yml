name: PR Android Tests
permissions:
  contents: read
on:
  pull_request:
    types: [labeled]
jobs:
  android-tests:
    if: github.event.label.name == 'run-android-tests'
    runs-on: ubuntu-latest
    # Keep a hard limit for a wedged emulator or instrumented test.
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Build before booting the emulator so Kotlin compilation and emulation do not
      # compete for the runner's CPU and memory.
      - name: Build instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # Recommended Linux setup from reactivecircus/android-emulator-runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Instrumentation Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # FLAG_CANCELED palm-rejection events were introduced in Android 13.
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot-save
            -noaudio
            -no-boot-anim
            -camera-back none
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            test_status=0; ./gradlew connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || test_status=$?; adb pull /sdcard/Android/data/com.ethran.notable/files/ui-review ui-review || true; if [ "$test_status" -ne 0 ]; then adb logcat -d > android-instrumentation-logcat.txt; fi; exit "$test_status"

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
            android-instrumentation-logcat.txt
            ui-review
          if-no-files-found: warn

      - name: Remove Label
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'run-android-tests'
            })
